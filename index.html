<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GO!GIRIT! 고기릿 공식 아카이브</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & Pretendard vibe -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              red: '#FF0033',
              hover: '#E6002E',
              dark: '#0A0E17',
              card: '#151D2A',
              border: '#242F42'
            }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0A0E17;
    }
    ::-webkit-scrollbar-thumb {
      background: #242F42;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #FF0033;
    }
    .aspect-video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
    }
    .aspect-video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body class="bg-brand-dark text-slate-100 min-h-screen flex flex-col font-sans selection:bg-brand-red selection:text-white antialiased">

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-40 bg-brand-dark/90 backdrop-blur-md border-b border-brand-border">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="filterCategory('전체')">
        <span class="flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-red to-orange-500 text-white font-black text-xl shadow-lg shadow-brand-red/30">
          <i class="fa-solid fa-play ml-0.5"></i>
        </span>
        <div>
          <span class="text-xl font-black tracking-tight text-white flex items-center gap-1.5">
            GO!GIRIT! <span class="text-xs px-2 py-0.5 rounded-full bg-brand-red/20 text-brand-red border border-brand-red/40 font-semibold tracking-normal">ARCHIVE</span>
          </span>
          <p class="text-[11px] text-slate-400 font-medium hidden sm:block">고기릿 전편 모아보기 웹 갤러리</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <span id="totalBadge" class="hidden sm:inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300">
          <i class="fa-solid fa-film text-brand-red"></i> 총 <span id="countText" class="text-white font-bold">34</span>개 영상
        </span>
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="relative bg-gradient-to-b from-slate-900 via-brand-dark to-brand-dark py-12 px-4 sm:px-6 lg:px-8 border-b border-brand-border/60">
    <div class="max-w-7xl mx-auto text-center space-y-4">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-red/10 border border-brand-red/30 text-brand-red text-xs font-bold tracking-wide uppercase">
        <i class="fa-solid fa-fire text-brand-red animate-pulse"></i> Official Video Collection
      </div>
      <h1 class="text-3xl sm:text-5xl font-black text-white tracking-tight leading-tight">
        GO!GIRIT! <span class="bg-clip-text text-transparent bg-gradient-to-r from-red-500 via-rose-400 to-amber-400">영상 컬렉션</span>
      </h1>
      <p class="text-slate-400 text-sm sm:text-base max-w-2xl mx-auto">
        강화도 MT, 푸꾸옥 MT 편부터 시즌 1, 시즌 2, 시즌 3까지 원하는 에피소드를 클릭하여 바로 감상해보세요.
      </p>

      <!-- Search Box -->
      <div class="max-w-md mx-auto pt-2">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="에피소드 제목, 번호 검색 (예: 강화도 MT, 푸꾸옥 MT, 1화, 녹화본 등)..."
            class="w-full bg-brand-card/90 border border-brand-border focus:border-brand-red focus:ring-1 focus:ring-brand-red text-white text-sm rounded-xl pl-11 pr-10 py-3.5 placeholder-slate-500 outline-none transition-all shadow-inner"
            oninput="handleSearch()"
          >
          <button 
            id="clearSearchBtn" 
            onclick="clearSearch()"
            class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white p-1"
          >
            <i class="fa-solid fa-xmark text-sm"></i>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Filter Category Tabs -->
  <div class="sticky top-16 z-30 bg-brand-dark/95 backdrop-blur-md border-b border-brand-border/80 py-3">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-3 overflow-x-auto no-scrollbar">
      <div class="flex items-center gap-2">
        <button 
          onclick="filterCategory('전체')" 
          data-category="전체" 
          class="cat-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 bg-brand-red text-white shadow-md shadow-brand-red/20 flex items-center gap-1.5 whitespace-nowrap"
        >
          <i class="fa-solid fa-layer-group"></i> 전체보기
        </button>
        <button 
          onclick="filterCategory('강화도 MT')" 
          data-category="강화도 MT" 
          class="cat-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white flex items-center gap-1.5 whitespace-nowrap"
        >
          <i class="fa-solid fa-campground"></i> 강화도 MT
        </button>
